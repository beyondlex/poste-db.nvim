services:
  postgres:
    image: postgres:16-alpine
    container_name: poste-test-postgres
    environment:
      POSTGRES_USER: poste
      POSTGRES_PASSWORD: poste_test
    ports:
      - "15432:5432"
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poste"]
      interval: 2s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: poste-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: poste_test
    ports:
      - "13306:3306"
    volumes:
      - ./init/mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pposte_test"]
      interval: 2s
      timeout: 3s
      retries: 10

  mariadb:
    image: mariadb:lts-ubi10
    container_name: poste-test-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: poste_test
    ports:
      - "13307:3306"
    volumes:
      - ./init/mariadb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pposte_test"]
      interval: 2s
      timeout: 3s
      retries: 10

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: poste-test-mssql
    # No official arm64 image — runs under Rosetta/QEMU emulation on
    # Apple Silicon, so startup is slow: generous start_period + retries.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Poste_test_2022"
      MSSQL_PID: Developer
    ports:
      - "11433:1433"
    volumes:
      - ./init/mssql:/docker-entrypoint-initdb.d:ro
    # The mssql image ignores /docker-entrypoint-initdb.d; our entrypoint
    # boots sqlservr, applies the seed scripts, then hands over.
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/entrypoint.sh"]
    healthcheck:
      # -C trusts the container's self-signed cert (required by mssql-tools18)
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Poste_test_2022' -Q 'SELECT 1' -C -b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: poste-test-clickhouse
    # arm64 image exists — runs natively on Apple Silicon.
    # Recent images disable network access for `default` unless credentials
    # are set explicitly.
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: poste_test
      CLICKHOUSE_DB: playground
    ports:
      - "18123:8123"
      - "19000:9000"
    volumes:
      - ./init/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password poste_test --query 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
