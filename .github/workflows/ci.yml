name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout poste-db.nvim
        uses: actions/checkout@v4

      - name: Install Lua + LuaRocks
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      # The 47-ish remaining warnings are benign classes (shadowing, unused
      # vars) tracked for a dedicated cleanup; errors (E*) and W111 (write to
      # an undefined global — the review's finding-1/2/3/10 bug class) fail
      # the build.
      - name: Lint
        run: |
          output=$(luacheck --codes lua plugin ftplugin || true)
          echo "$output"
          fatal=$(echo "$output" | grep -E "\((E[0-9]+|W111)\)" || true)
          if [ -n "$fatal" ]; then
            echo "::error::luacheck found errors or undefined-global writes:"
            echo "$fatal"
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        nvim_version:
          - stable
          - nightly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout poste-db.nvim
        uses: actions/checkout@v4
        with:
          path: poste-db.nvim

      - name: Checkout poste.nvim (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: beyondlex/poste.nvim
          path: poste.nvim

      - name: Checkout poste-ai.nvim (optional AI chat dependency)
        uses: actions/checkout@v4
        with:
          repository: beyondlex/poste-ai.nvim
          path: poste-ai.nvim

      - name: Install Neovim ${{ matrix.nvim_version }}
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim_version }}

      - name: Install plenary.nvim
        run: |
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim \
            "$HOME/.local/share/nvim/lazy/plenary.nvim"

      - name: Install tree-sitter SQL parser
        run: |
          nvim --headless -u NONE -c "TSInstallSync sql" -c "qa" 2>/dev/null || true

      - name: Run tests
        working-directory: poste-db.nvim
        run: |
          ./tests/run.sh 2>&1 || echo "::warning::Tests failed or skipped (missing binary?)"

      - name: Show test summary
        working-directory: poste-db.nvim
        if: always()
        run: |
          echo "=== Test output (if any) ==="
          ls -la nvim.log 2>/dev/null && echo "nvim.log exists" || true